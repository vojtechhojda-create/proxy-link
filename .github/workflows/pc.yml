name: pc
on:
  push:
    paths: ['proxylink-pc/**']
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # mac signing is used only when these repository secrets exist, see README
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        working-directory: proxylink-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: node test/selftest.cjs

      - name: package windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: package mac (unsigned)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT != 'true'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: package mac (signed + notarized)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: npx electron-builder --mac --publish never -c.mac.hardenedRuntime=true -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: proxylink-pc-${{ runner.os }}
          path: |
            proxylink-pc/release/*.exe
            proxylink-pc/release/*.dmg
            proxylink-pc/release/*.zip
