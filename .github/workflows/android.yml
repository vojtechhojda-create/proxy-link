name: android
on:
  push:
    paths: ['proxylink-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['proxylink-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxylink-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # no gradle wrapper in the repo: gradle 8.9 is provided here (agp 8.5.2 needs gradle 8.7+)
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: proxylink-debug-apk
          path: proxylink-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
